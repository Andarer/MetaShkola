name: Web CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Web CI (Typecheck, Lint, Test, Build, PWA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Strict npm ci)
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: Run Domain Logic Unit Tests
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Verify Web & PWA Artifacts
        run: |
          echo "=== Verifying build output ==="
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -f dist/manifest.json || { echo "ERROR: dist/manifest.json missing"; exit 1; }
          test -f dist/sw.js || { echo "ERROR: dist/sw.js missing"; exit 1; }
          test -f dist/favicon.svg || { echo "ERROR: dist/favicon.svg missing"; exit 1; }
          
          # Check asset directories
          test -d dist/assets || { echo "ERROR: dist/assets directory missing"; exit 1; }
          
          # Validate PWA manifest JSON syntax
          node -e "JSON.parse(require('fs').readFileSync('dist/manifest.json'))" || { echo "ERROR: Invalid manifest.json JSON"; exit 1; }
          
          echo "All required files verified successfully!"
          ls -la dist/

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaschool-web-dist
          path: dist/
          retention-days: 14
