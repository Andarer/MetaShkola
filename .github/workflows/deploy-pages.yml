name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run Domain Logic Tests
        run: npm run test

      - name: Configure GitHub Pages Base
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Web Application for GitHub Pages
        # Uses repository subpath for GitHub Pages (e.g. /MetaShkola/) or root if custom domain
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/MetaShkola/' }}
        run: |
          echo "Building with BASE_PATH=$BASE_PATH"
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build Android APK on GitHub Runner
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Embed Compiled APK into GitHub Pages distribution
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            mkdir -p dist/downloads
            cp "$APK_FILE" dist/downloads/MetaSchool-v2.0.1.apk
            cd dist/downloads
            sha256sum MetaSchool-v2.0.1.apk > MetaSchool-v2.0.1.apk.sha256
            cd ../..
            echo "Successfully embedded Android APK into dist/downloads/!"
            ls -lh dist/downloads/
          else
            echo "Warning: APK not found, skipping embed"
          fi

      - name: Validate GitHub Pages PWA bundle
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -f dist/sw.js || { echo "ERROR: dist/sw.js missing"; exit 1; }
          test -f dist/manifest.json || { echo "ERROR: dist/manifest.json missing"; exit 1; }
          test -f dist/downloads/MetaSchool-v2.0.1.apk || echo "Notice: dist/downloads/MetaSchool-v2.0.1.apk will be served from GitHub Pages"
          echo "GitHub Pages bundle verified!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
