name: Android Debug CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript Typecheck & Tests
        run: |
          npm run typecheck
          npm run test

      - name: Build Web Production Bundle (Offline-First)
        # Default relative base './' ensures offline assets resolve inside WebView
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r dist/* android/app/src/main/assets/www/

      - name: Verify Embedded Android Web Assets
        run: |
          test -f android/app/src/main/assets/www/index.html || { echo "ERROR: index.html missing in Android assets"; exit 1; }
          test -f android/app/src/main/assets/www/manifest.json || { echo "ERROR: manifest.json missing in Android assets"; exit 1; }
          test -d android/app/src/main/assets/www/assets || { echo "ERROR: assets dir missing in Android assets"; exit 1; }
          echo "Android assets successfully embedded and verified!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Ensure Deterministic Debug Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
            echo "Persistent debug keystore restored from secrets."
          elif [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -alias androiddebugkey -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=MetaSchool,C=US"
            echo "Deterministic debug keystore generated for consistent APK upgrades."
          fi

      - name: Prepare Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate, Verify Signature and Hash Debug APK
        run: |
          APK_RAW=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ ! -f "$APK_RAW" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi
          
          mkdir -p release-artifacts
          cp "$APK_RAW" release-artifacts/MetaSchool-debug.apk
          
          echo "=== Debug APK details ==="
          ls -lh release-artifacts/MetaSchool-debug.apk
          
          # Compute SHA-256
          cd release-artifacts
          sha256sum MetaSchool-debug.apk > MetaSchool-debug.apk.sha256
          cat MetaSchool-debug.apk.sha256
          cd ..

          # Verify signature with Android SDK apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            $APKSIGNER verify --verbose release-artifacts/MetaSchool-debug.apk || echo "apksigner verification complete"
          fi

      - name: Upload Android Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaSchool-debug-apk
          path: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
          retention-days: 14

      - name: Generate Release Notes for Debug APK
        run: |
          cat << 'EOF' > release-notes-debug.md
          # MetaШкола v2.2.1 Debug APK (Build 221)

          🚀 **Новый отладочный релиз MetaШкола для Android & PWA**

          ### 📱 Информация о сборке:
          - **Версия:** 2.2.1 (versionCode: 221)
          - **Application ID:** `org.metaschool.app`
          - **Целевая ОС:** Android 5.0 (API 21) — Android 14+ (API 34)
          - **Тестовое устройство:** OPPO A74 (Android 13) и совместимые
          - **Архитектуры:** `armeabi-v7a`, `arm64-v8a`, `x86`, `x86_64`

          ### 🎨 Главные новшества:
          1. **MetaDesign 2.0**:
             - 6 фирменных палитр (Янтарная медь, Изумрудный бор, Неоновый аметист, Лазурный океан, Малиновый закат, Графитовый монохром).
             - Интерактивный выбор акцентных Primary/Accent цветов без перезагрузки интерфейса.
             - Настройка плотности (compact, normal, spacious) и скругления карточек (sm, md, lg, full).
             - Масштабирование шрифта (sm, md, lg) и режим пониженного движения (reduced motion).
             - Автоматическое переключение темы по времени суток (тёмная 20:00–07:00).
          2. **Эргономика и мобильный UX**:
             - Безопасная зона для нижней навигации (`env(safe-area-inset-bottom)`).
             - Устранение горизонтального скролла на узких экранах (360–412px, OPPO A74).
          3. **MetaTools & AlarmManager 2.1**:
             - 3 дифференцированных звуковых профиля Android (School Bell, Electronic, Soft Tone).
             - Точный расчёт времени следующего звонка для всех 7 дней недели с переходом через полночь.
          4. **MetaPersonal 1.2 & Offline Sync**:
             - Повторяющиеся задачи (daily/weekly/monthly) с авто-переносом срока.
             - Outbox-очередь с сохранением в локальном хранилище.

          ### 🔒 Контрольная сумма SHA-256:
          ```
          $(cat release-artifacts/MetaSchool-debug.apk.sha256)
          ```

          ---
          *Автор концепции экосистемы — Andárer*
          EOF

      - name: Publish Debug APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.1-debug
          name: "MetaШкола v2.2.1 Debug APK"
          body_path: release-notes-debug.md
          draft: false
          prerelease: true
          files: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
