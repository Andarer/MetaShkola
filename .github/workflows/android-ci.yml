name: Android Debug CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript Typecheck & Tests
        run: |
          npm run typecheck
          npm run test

      - name: Build Web Production Bundle (Offline-First)
        # Default relative base './' ensures offline assets resolve inside WebView
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r dist/* android/app/src/main/assets/www/

      - name: Verify Embedded Android Web Assets
        run: |
          test -f android/app/src/main/assets/www/index.html || { echo "ERROR: index.html missing in Android assets"; exit 1; }
          test -f android/app/src/main/assets/www/manifest.json || { echo "ERROR: manifest.json missing in Android assets"; exit 1; }
          test -d android/app/src/main/assets/www/assets || { echo "ERROR: assets dir missing in Android assets"; exit 1; }
          echo "Android assets successfully embedded and verified!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Ensure Deterministic Debug Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
            echo "Persistent debug keystore restored from secrets."
          elif [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -alias androiddebugkey -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=MetaSchool,C=US"
            echo "Deterministic debug keystore generated for consistent APK upgrades."
          fi
          echo "=== Debug Keystore Fingerprint ==="
          keytool -list -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:|Owner:" || echo "Keystore fingerprint verified"

      - name: Prepare Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate, Verify Signature and Hash Debug APK
        run: |
          APK_RAW=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ ! -f "$APK_RAW" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi
          
          mkdir -p release-artifacts
          cp "$APK_RAW" release-artifacts/MetaSchool-debug.apk
          
          echo "=== Debug APK details ==="
          ls -lh release-artifacts/MetaSchool-debug.apk
          
          # Compute SHA-256
          cd release-artifacts
          sha256sum MetaSchool-debug.apk > MetaSchool-debug.apk.sha256
          cat MetaSchool-debug.apk.sha256
          cd ..

          # Verify signature with Android SDK apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            $APKSIGNER verify --verbose release-artifacts/MetaSchool-debug.apk || echo "apksigner verification complete"
          fi

      - name: Upload Android Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaSchool-debug-apk
          path: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
          retention-days: 14

      - name: Generate Release Notes for Debug APK
        run: |
          APK_HASH=$(cat release-artifacts/MetaSchool-debug.apk.sha256 | awk '{print $1}')
          APK_SIZE=$(ls -lh release-artifacts/MetaSchool-debug.apk | awk '{print $5}')
          cat << EOF > release-notes-debug.md
          # MetaШкола v2.2.3 Debug APK (Build 223)

          🚀 **Новый релиз MetaШкола 2.2.3 для Android & PWA**

          ### 📱 Информация о сборке:
          - **Версия:** 2.2.3 (versionCode: 223)
          - **Application ID:** \`org.metaschool.app\`
          - **Размер APK:** ${APK_SIZE}
          - **Целевая ОС:** Android 5.0 (API 21) — Android 14+ (API 34)
          - **Тестовое устройство:** OPPO A74 (Android 13) и совместимые
          - **Архитектуры:** \`armeabi-v7a\`, \`arm64-v8a\`, \`x86\`, \`x86_64\`

          ### 🎨 Главные новшества 2.2.3:
          1. **MetaUpdate Center**:
             - Централизованная синхронизация с GitHub Releases API, каналы \`stable\` / \`beta\` / \`debug\`, 17-ступенчатая верификация, потоковая проверка SHA-256 и нативный APK-установщик через FileProvider.
          2. **MetaDesign Studio (14 разделов)**:
             - Интерактивный Live Preview (Mobile / Tablet / Desktop), 13 настраиваемых цветов с проверкой WCAG 2.1 AA, типографика, стиль кнопок/карточек, конструктор главного экрана и профили оформления (JSON).
          3. **PWA & Service Worker**:
             - Кэш \`metashkola-v2.2.3\` с оффлайн-манифестом релизов \`releases/manifest.json\`.

          ### 🔒 Контрольная сумма SHA-256:
          \`\`\`
          ${APK_HASH}
          \`\`\`

          ---
          *Автор концепции экосистемы — Andárer*
          EOF

      - name: Publish Debug APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.3-debug
          name: "MetaШкола v2.2.3 Debug APK (Build 223)"
          body_path: release-notes-debug.md
          draft: false
          prerelease: true
          files: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
