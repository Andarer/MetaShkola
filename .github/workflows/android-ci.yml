name: Android Debug CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript Typecheck & Tests
        run: |
          npm run typecheck
          npm run test

      - name: Build Web Production Bundle (Offline-First)
        # Default relative base './' ensures offline assets resolve inside WebView
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r dist/* android/app/src/main/assets/www/

      - name: Verify Embedded Android Web Assets
        run: |
          test -f android/app/src/main/assets/www/index.html || { echo "ERROR: index.html missing in Android assets"; exit 1; }
          test -f android/app/src/main/assets/www/manifest.json || { echo "ERROR: manifest.json missing in Android assets"; exit 1; }
          test -d android/app/src/main/assets/www/assets || { echo "ERROR: assets dir missing in Android assets"; exit 1; }
          echo "Android assets successfully embedded and verified!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate, Verify Signature and Hash Debug APK
        run: |
          APK_RAW=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ ! -f "$APK_RAW" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi
          
          mkdir -p release-artifacts
          cp "$APK_RAW" release-artifacts/MetaSchool-debug.apk
          
          echo "=== Debug APK details ==="
          ls -lh release-artifacts/MetaSchool-debug.apk
          
          # Compute SHA-256
          cd release-artifacts
          sha256sum MetaSchool-debug.apk > MetaSchool-debug.apk.sha256
          cat MetaSchool-debug.apk.sha256
          cd ..

          # Verify signature with Android SDK apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            $APKSIGNER verify --verbose release-artifacts/MetaSchool-debug.apk || echo "apksigner verification complete"
          fi

      - name: Upload Android Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaSchool-debug-apk
          path: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
          retention-days: 14

      - name: Extract Project Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for version v$VERSION"

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: "MetaШкола ${{ steps.pkg_version.outputs.version }} (Android APK & PWA)"
          draft: false
          prerelease: false
          files: |
            release-artifacts/MetaSchool-debug.apk
            release-artifacts/MetaSchool-debug.apk.sha256
          body: |
            ## MetaШкола ${{ steps.pkg_version.outputs.version }} (Android APK & PWA)
            
            Автоматическая сборка мобильного приложения от GitHub Actions CI/CD.
            
            ### 📱 Установка на Android (Lollipop 5.0+ до Android 14+ / OPPO A74):
            1. Скачайте прикрепленный файл **`MetaSchool-debug.apk`**.
            2. Нажмите «Установить» на вашем устройстве (при необходимости разрешите установку для браузера).
            3. Приложение поддерживает 100% автономную работу (Offline-First), полифонические звонки, расписание и MetaCommunity.
            
            ### 🌐 Веб-версия (PWA):
            - Доступна онлайн: [https://andarer.github.io/MetaShkola/](https://andarer.github.io/MetaShkola/)
            
            ### 🔒 Контрольные суммы:
            - См. файл `MetaSchool-debug.apk.sha256`
